[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-alpha"
version = "0.1.0"
description = "Research-first Alpha Research Operating System for China A-shares with candidate discovery, lifecycle strategy research, validation, and execution simulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "tushare>=1.4",
    "akshare>=1.18",
    "baostock>=0.9",
    "yfinance>=0.2.66",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "pyarrow>=16.0",
    "polars>=1.0",
    "apscheduler>=3.10",
]

[project.scripts]
prepare-free-data-operation = "market_regime_alpha.cli.free_data_operation:prepare_main"
run-free-data-decision-window = "market_regime_alpha.cli.free_data_operation:run_main"
resume-free-data-operation = "market_regime_alpha.cli.free_data_operation:resume_main"
replay-free-data-operation = "market_regime_alpha.cli.free_data_operation:replay_main"
report-free-data-operation = "market_regime_alpha.cli.free_data_operation:report_main"
inspect-free-data-operation = "market_regime_alpha.cli.free_data_operation:inspect_main"
continuous-research = "market_regime_alpha.cli.continuous_research:main"
state-system = "market_regime_alpha.cli.state_system:main"
decision-system = "market_regime_alpha.cli.decision_system:main"
model-governance = "market_regime_alpha.cli.model_governance:main"
pit-authority = "market_regime_alpha.cli.pit_authority:main"
research-shadow = "market_regime_alpha.cli.research_shadow:main"

[project.optional-dependencies]
postgres = []
dev = [
    "build>=1.2",
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_regime_alpha = [
    "persistence/postgres/migrations/*.sql",
    "platform/migrations/*.sql",
    "decision/migrations/*.sql",
    "portfolio/migrations/*.sql",
    "position/migrations/*.sql",
    "execution/migrations/*.sql",
    "application/operational_research/migrations/*.sql",
    "application/canonical_lifecycle/migrations/*.sql",
    "application/controlled_operation/migrations/*.sql",
    "features/migrations/*.sql",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "tests", "scripts", "backtesting"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
