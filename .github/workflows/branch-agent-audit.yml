name: branch-agent-audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit remote branches and agent files
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/branch-agent-audit
          {
            echo -e 'branch\tsha\tmerged_into_main\tahead_of_main\tbehind_main\tcommitter_date\tsubject'
            while IFS=$'\t' read -r ref sha date subject; do
              branch="${ref#origin/}"
              [ "$branch" = 'HEAD' ] && continue
              if git merge-base --is-ancestor "$sha" origin/main; then
                merged=true
              else
                merged=false
              fi
              counts=$(git rev-list --left-right --count "origin/main...$sha")
              behind=$(printf '%s' "$counts" | awk '{print $1}')
              ahead=$(printf '%s' "$counts" | awk '{print $2}')
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$branch" "$sha" "$merged" "$ahead" "$behind" "$date" "$subject"
            done < <(git for-each-ref --format='%(refname:short)%09%(objectname)%09%(committerdate:iso8601-strict)%09%(subject)' refs/remotes/origin | sort)
          } > /tmp/branch-agent-audit/branches.tsv
          {
            echo '# Unmerged branch unique commits'
            while IFS=$'\t' read -r branch sha merged ahead behind date subject; do
              [ "$branch" = 'branch' ] && continue
              [ "$merged" = 'true' ] && continue
              echo
              echo "## $branch"
              git log --oneline --decorate --no-merges "origin/main..$sha" || true
            done < /tmp/branch-agent-audit/branches.tsv
          } > /tmp/branch-agent-audit/unmerged-commits.md
          find . -type f -not -path './.git/*' \
            | sed 's#^./##' \
            | grep -Ei '(^|/)(CLAUDE\.md|CLAUDE\.me|AGENTS\.md|CODEX\.md|GEMINI\.md|\.claude/|\.agents/|agents?/|[^/]*agent[^/]*)' \
            | sort > /tmp/branch-agent-audit/agent-files.txt || true
          git ls-files | sort > /tmp/branch-agent-audit/tracked-files.txt
          git rev-parse origin/main > /tmp/branch-agent-audit/main-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: branch-agent-audit
          path: /tmp/branch-agent-audit
          retention-days: 1
